<!doctype html>
<html lang="en" data-theme="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Variant 3</title>
<style>
:root{--bg:#f4f6f3;--fg:#10201a;--muted:#55665e;--line:#cfd8d2;--accent:#0f6b4f}
:root[data-theme=dark]{--bg:#0c1512;--fg:#e6efe9;--muted:#8fa59a;--line:#22332c;--accent:#5fd3a8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 "SF Mono",Menlo,Consolas,monospace}
.c{max-width:1040px;margin:0 auto;padding:0 40px}
nav{display:flex;justify-content:center;gap:32px;padding:26px 0;font-size:14px;color:var(--muted)}
nav b{color:var(--fg)}
.hero{text-align:center;padding:104px 0 64px}
.k{color:var(--accent);font-size:14px;margin-bottom:20px}
h1{font-size:54px;line-height:1.12;letter-spacing:-.03em;font-weight:600;margin:0 auto 24px;max-width:860px}
p{color:var(--muted);margin:0 auto 36px;max-width:560px}
form{display:inline-flex;border:1px solid var(--line)}
form span{padding:14px 20px;color:var(--muted);min-width:260px;text-align:left}
form b{background:var(--accent);color:var(--bg);padding:14px 22px}
</style><script>addEventListener('message',function(e){if(e.data&&e.data.brandTheme)document.documentElement.dataset.theme=e.data.brandTheme})</script></head>
<body><div class="c"><nav><b>sample-name</b><span>writing</span><span>courses</span><span>about</span></nav>
<section class="hero"><div class="k">// one essay every second Tuesday</div><h1>Notes on building software that lasts.</h1><p>For engineers who would rather understand a system than memorise it.</p><form><span>you@example.com</span><b>Subscribe</b></form></section></div></body></html>
