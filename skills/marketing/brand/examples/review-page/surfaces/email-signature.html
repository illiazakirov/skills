<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><title>Email signature</title><style>
:root{--bg:#f6f4ef;--fg:#16150f;--muted:#6b675c;--accent:#b4451f}
:root[data-theme="dark"]{--bg:#14130f;--fg:#f1eee6;--muted:#9c978a;--accent:#e2733f}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Georgia,"Times New Roman",serif}
.mark{display:inline-grid;place-items:center;background:var(--fg);color:var(--bg);font-weight:700;border-radius:50%}
.sans{font-family:ui-sans-serif,system-ui,sans-serif}
body{padding:20px 24px;display:flex;align-items:center;gap:16px}.mark{width:56px;height:56px;font-size:20px;flex:none}b{font-size:17px}div div{font-size:14px;color:var(--muted);margin-top:4px}</style></head><body><span class="mark">MK</span><div class="sans"><b>Marta Koval</b><div>Plain words for hard systems. &nbsp;·&nbsp; marta.example</div></div><script>addEventListener('message',function(e){if(e.data&&e.data.brandTheme)document.documentElement.dataset.theme=e.data.brandTheme})</script></body></html>
