<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><title>OG image</title><style>
:root{--bg:#f6f4ef;--fg:#16150f;--muted:#6b675c;--accent:#b4451f}
:root[data-theme="dark"]{--bg:#14130f;--fg:#f1eee6;--muted:#9c978a;--accent:#e2733f}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Georgia,"Times New Roman",serif}
.mark{display:inline-grid;place-items:center;background:var(--fg);color:var(--bg);font-weight:700;border-radius:50%}
.sans{font-family:ui-sans-serif,system-ui,sans-serif}
body{padding:72px 80px;display:flex;flex-direction:column;justify-content:space-between}h1{font-size:84px;line-height:1.04;font-weight:400;margin:0;max-width:13ch;letter-spacing:-.02em}.f{display:flex;align-items:center;gap:16px;font-size:24px}.f .mark{width:52px;height:52px;font-size:20px}</style></head><body><h1>Plain words for hard systems.</h1><div class="f sans"><span class="mark">MK</span>Marta Koval</div><script>addEventListener('message',function(e){if(e.data&&e.data.brandTheme)document.documentElement.dataset.theme=e.data.brandTheme})</script></body></html>
