<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><title>Site hero</title><style>
:root{--bg:#f6f4ef;--fg:#16150f;--muted:#6b675c;--accent:#b4451f}
:root[data-theme="dark"]{--bg:#14130f;--fg:#f1eee6;--muted:#9c978a;--accent:#e2733f}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Georgia,"Times New Roman",serif}
.mark{display:inline-grid;place-items:center;background:var(--fg);color:var(--bg);font-weight:700;border-radius:50%}
.sans{font-family:ui-sans-serif,system-ui,sans-serif}
.w{max-width:1200px;margin:0 auto;padding:36px 48px}nav{display:flex;align-items:center;gap:14px;font-size:15px}nav .mark{width:36px;height:36px;font-size:15px}nav span{margin-left:auto;color:var(--muted)}h1{font-size:88px;line-height:1.02;letter-spacing:-.02em;margin:150px 0 28px;max-width:14ch;font-weight:400}p{font-size:22px;line-height:1.5;color:var(--muted);max-width:44ch;margin:0 0 40px}a{display:inline-block;background:var(--accent);color:#fff;padding:16px 28px;text-decoration:none;font-size:17px}</style></head><body><div class="w"><nav class="sans"><span class="mark">MK</span><b>Marta Koval</b><span>Notes &nbsp; Work &nbsp; Contact</span></nav><h1>Plain words for hard systems.</h1><p class="sans">I help engineering teams explain what they build, so the people who pay for it understand it.</p><a class="sans" href="#">Read the notes</a></div><script>addEventListener('message',function(e){if(e.data&&e.data.brandTheme)document.documentElement.dataset.theme=e.data.brandTheme})</script></body></html>
