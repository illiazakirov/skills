<!doctype html>
<html lang="{{lang}}" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{name}}</title>
<style>
:root{--page:#f2f2f2;--label:#6b6b6b;--rule:#d6d6d6}
html[data-theme="dark"]{--page:#1c1c1c;--label:#9a9a9a;--rule:#3a3a3a}
*{box-sizing:border-box}
body{margin:0;background:var(--page);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:40px}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule);border:1px solid var(--rule)}
.panel{display:flex;align-items:center;justify-content:center;min-height:120px;padding:32px}
.light{background:#fff;color:#111}
.dark{background:#111;color:#fff}
.large{grid-column:1/-1;min-height:420px}
.wide{grid-column:1/-1}
.large svg{display:block;width:auto;height:auto;max-width:60%;max-height:240px}
.full svg{display:block;height:72px;width:auto;max-width:80%}
.mark svg{display:block;height:140px;width:auto}
.sizes{gap:40px;align-items:flex-end}
.sizes figure{margin:0;text-align:center}
.sizes svg{display:block;width:auto;margin:0 auto 10px}
.sizes figcaption,.label{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--label)}
.dark figcaption{color:#9a9a9a}
.light figcaption{color:#6b6b6b}
.label{margin:28px 0 10px}
.bar{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;border:1px solid var(--rule)}
.bar svg{display:block;height:28px;width:auto}
.bar span{display:block;width:120px;height:8px;border-radius:4px;background:currentColor;opacity:.18}
.bar+.bar{border-top:0}
@media (max-width:700px){
.wrap{padding:16px}
.panels{grid-template-columns:1fr}
.large{min-height:240px}
.sizes{gap:24px}
.bar{padding:14px 16px}.bar span{width:64px}
}
</style>
</head>
<body>
<div class="wrap">
<div class="panels">
<div class="panel large light">{{full}}</div>
<div class="panel mark light">{{mark}}</div>
<div class="panel full dark">{{dark}}</div>
{{sizes}}
{{sizes_dark}}
</div>
<p class="label">{{header_label}}</p>
<div class="bar light">{{full}}<span></span></div>
<div class="bar dark">{{dark}}<span></span></div>
</div>
<script>addEventListener('message',function(e){if(e.data&&e.data.brandTheme)document.documentElement.dataset.theme=e.data.brandTheme})</script>
</body>
</html>
